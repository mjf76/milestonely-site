<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Milestonely — Coming Soon</title>
<meta name="description" content="Milestonely sta arrivando. Iscriviti per essere avvisato al lancio.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .logo {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 1rem;
  }
  .tag {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    font-weight: 400;
    opacity: 0.92;
    max-width: 38rem;
    line-height: 1.5;
    margin-bottom: 2.5rem;
  }
  .badge {
    display: inline-block;
    padding: 0.45rem 1rem;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .contact {
    margin-top: 3rem;
    font-size: 0.9rem;
    opacity: 0.75;
  }
  .contact a {
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 1px;
  }
  .contact a:hover { opacity: 1; border-bottom-color: #fff; }
  .footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.75rem;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Coming soon</span>
    <h1 class="logo">Milestonely</h1>
    <p class="tag">
      Stiamo costruendo qualcosa di speciale.<br>
      Il lancio è previsto a breve.
    </p>
    <p class="contact">
      Info e contatti: <a href="mailto:milestonely.app@gmail.com">milestonely.app@gmail.com</a>
    </p>
    <p class="footer">© 2026 Milestonely</p>
  </div>
</body>
</html>
